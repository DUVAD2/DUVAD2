<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timetable — Pulse Studio</title>
    <meta
      name="description"
      content="The full weekly class timetable at Pulse Studio. Filter by class or coach and book your spot."
    />
    <meta name="theme-color" content="#151b24" />
    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='20'>%F0%9F%94%A5</text></svg>"
    />
  </head>
  <body data-page="timetable">
    <a class="skip" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="shell site-header__inner">
        <a class="brand" href="index.html">
          <svg aria-hidden="true" focusable="false" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2 4.09 12.6a1 1 0 0 0 .77 1.64H11l-1 8 8.91-10.6a1 1 0 0 0-.77-1.64H12l1-8Z" />
          </svg>
          Pulse Studio
        </a>
        <nav class="nav" aria-label="Main">
          <a href="index.html" data-nav="home">Home</a>
          <a href="timetable.html" data-nav="timetable">Timetable</a>
          <a href="bookings.html" data-nav="bookings">
            Bookings
            <span class="nav__count" data-booking-count hidden></span>
          </a>
        </nav>
      </div>
    </header>

    <main id="main" class="shell" style="padding-block: 40px 20px">
      <div class="head">
        <p class="eyebrow">Timetable</p>
        <h2>Book your week</h2>
        <p>
          Every class we run, with live spaces. Booking closes 15 minutes before
          a class starts, and you can cancel free up to 4 hours before.
        </p>
        <div id="storage-warning"></div>
      </div>

      <!-- ---------- Filters ---------- -->
      <div class="filters">
        <div class="field">
          <label for="f-class">Class</label>
          <select id="f-class">
            <option value="">All classes</option>
          </select>
        </div>
        <div class="field">
          <label for="f-coach">Coach</label>
          <select id="f-coach">
            <option value="">Any coach</option>
          </select>
        </div>
        <div class="field">
          <label for="f-time">Time of day</label>
          <select id="f-time">
            <option value="">Any time</option>
            <option value="morning">Morning (before 12:00)</option>
            <option value="afternoon">Afternoon (12:00–17:00)</option>
            <option value="evening">Evening (from 17:00)</option>
          </select>
        </div>
        <div class="field" style="min-width: 150px">
          <label for="f-avail">Availability</label>
          <select id="f-avail">
            <option value="">Show everything</option>
            <option value="open">Only classes with spaces</option>
          </select>
        </div>
        <button class="btn btn--ghost btn--sm" type="button" id="f-reset">Reset</button>
      </div>

      <!-- ---------- Week navigation ---------- -->
      <div class="weeknav">
        <h3 class="weeknav__range" id="week-range">&nbsp;</h3>
        <div class="weeknav__controls">
          <button class="btn btn--ghost btn--sm" type="button" id="week-prev">
            <svg aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6" /></svg>
            Previous
          </button>
          <button class="btn btn--ghost btn--sm" type="button" id="week-today">This week</button>
          <button class="btn btn--ghost btn--sm" type="button" id="week-next">
            Next
            <svg aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg>
          </button>
        </div>
      </div>

      <p class="sr-only" id="results-live" aria-live="polite"></p>

      <div id="week"></div>
    </main>

    <footer class="site-footer">
      <div class="shell site-footer__inner">
        <p>&copy; <span id="year"></span> Pulse Studio</p>
        <p><a href="index.html">Home</a> · <a href="bookings.html">My bookings</a></p>
      </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/schedule.js"></script>
    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/timetable.js"></script>
  </body>
</html>
